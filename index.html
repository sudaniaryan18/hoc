    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {

                            700: '#1e3a8a',
                            800: '#172554',
                        },
                        gold: {
                            400: '#facc15',
                            500: '#eab308',
                            600: '#ca8a04',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        @media print {
            body * {
                visibility: hidden;
            }
            #printable-receipt, #printable-receipt * {
                visibility: visible;
            }
            #printable-receipt {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
        }
    </style>
</head>

            {

                reviewsCount: 78,

                description: "Sturdy 100% natural cotton canvas tote with heavy reinforced straps and internal zip pocket. Printed with school insignia.",
                sizes: ["Standard"],
                colors: ["Natural Off-White"],
                badge: "Popular",

            },
            {
                id: 9,
                name: "LGH School Pride Cap & Lanyard Set",
                category: "Accessories",
                price: 499,
                originalPrice: 649,
                rating: 4.7,
                reviewsCount: 112,
                image: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?auto=format&fit=crop&q=80&w=600",
                description: "Adjustable embroidered cotton baseball cap bundled with a quick-release satin ID lanyard and metal LGH keychain clip.",
                sizes: ["One Size Fits All"],
                colors: ["Navy Blue"],
                badge: "Combo Pack",
                inStock: true
            }
        ];

        function App() {
            // App state management
            const [products] = React.useState(PRODUCTS_DATA);
            const [selectedCategory, setSelectedCategory] = React.useState("All");
            const [searchQuery, setSearchQuery] = React.useState("");
            const [sortBy, setSortBy] = React.useState("featured");
            
            // Cart state
            const [cart, setCart] = React.useState([]);
            const [isCartOpen, setIsCartOpen] = React.useState(false);
            
            // Active views: 'store', 'checkout', 'confirmation'
            const [currentView, setCurrentView] = React.useState('store');
            
            // Selected product for modal view
            const [modalProduct, setModalProduct] = React.useState(null);
            
            // Notification toast state
            const [toastMessage, setToastMessage] = React.useState(null);

            // Checkout state
            const [customerInfo, setCustomerInfo] = React.useState({
                fullName: '',
                email: '',
                phone: '',
                studentId: '',
                gradeSection: '',
                address: '',
                city: 'Jamnagar',
                pincode: '',
                deliveryType: 'campus' // 'campus' or 'home'
            });

            const [paymentMethod, setPaymentMethod] = React.useState('upi'); // 'upi', 'card', 'cod'
            const [upiId, setUpiId] = React.useState('');
            const [cardDetails, setCardDetails] = React.useState({
                number: '',
                expiry: '',
                cvv: '',
                name: ''
            });

            const [completedOrder, setCompletedOrder] = React.useState(null);

            // Toast feedback trigger
            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            const addToCart = (product, selectedSize = null, selectedColor = null, quantity = 1) => {
                const size = selectedSize || (product.sizes ? product.sizes[0] : 'Standard');
                const color = selectedColor || (product.colors ? product.colors[0] : 'Default');
                
                const cartItemId = `${product.id}-${size}-${color}`;
                
                setCart(prevCart => {
                    const existingIndex = prevCart.findIndex(item => item.cartItemId === cartItemId);
                    if (existingIndex > -1) {
                        const updated = [...prevCart];
                        updated[existingIndex].quantity += quantity;
                        return updated;
                    } else {
                        return [...prevCart, {
                            ...product,
                            cartItemId,
                            selectedSize: size,
                            selectedColor: color,
                            quantity
                        }];
                    }
                });

                showToast(`Added "${product.name}" to your cart!`);
            };

            const updateCartQuantity = (cartItemId, change) => {
                setCart(prevCart => {
                    return prevCart.map(item => {
                        if (item.cartItemId === cartItemId) {
                            const newQty = item.quantity + change;
                            return newQty > 0 ? { ...item, quantity: newQty } : null;
                        }
                        return item;
                    }).filter(Boolean);
                });
            };

            const removeFromCart = (cartItemId) => {
                setCart(prevCart => prevCart.filter(item => item.cartItemId !== cartItemId));
                showToast("Item removed from cart");
            };

            const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const cartItemsCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const shippingFee = cartTotal > 1000 || customerInfo.deliveryType === 'campus' ? 0 : 50;
            const grandTotal = cartTotal + shippingFee;

            const categories = ["All", "Apparel", "Stationery", "Accessories", "Bags & Gear"];

            const filteredProducts = products.filter(product => {
                const matchesCategory = selectedCategory === "All" || product.category === selectedCategory;
                const matchesSearch = product.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      product.description.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            }).sort((a, b) => {
                if (sortBy === 'price-low') return a.price - b.price;
                if (sortBy === 'price-high') return b.price - a.price;
                if (sortBy === 'rating') return b.rating - a.rating;
                return a.id - b.id; // Default featured
            });

            // Handlers
            const handleCheckoutSubmit = (e) => {
                e.preventDefault();
                if (cart.length === 0) {
                    alert("Your cart is empty!");
                    return;
                }

                // Create Order Object
                const orderData = {
                    orderId: "SCH-" + Math.floor(100000 + Math.random() * 900000),
                    orderDate: new Date().toLocaleDateString('en-IN', {
                        day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
                    }),
                    items: [...cart],
                    customerInfo: { ...customerInfo },
                    paymentMethod,
                    subtotal: cartTotal,
                    shippingFee,
                    grandTotal,
                    status: "Confirmed"
                };

                setCompletedOrder(orderData);
                setCart([]);
                setCurrentView('confirmation');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            return (
                <div className="flex flex-col min-h-screen">
                    {}
                    <div className="bg-brand-800 text-white text-xs py-2 px-4 text-center font-medium tracking-wide flex justify-between items-center px-4 md:px-8">
                        <span><i className="fa-solid fa-graduation-cap mr-1 text-gold-400"></i> Shri L. G. Haria School Store - Free Campus Delivery on all orders over ₹999</span>
                        <div className="hidden sm:flex items-center gap-4">
                            <span><i className="fa-solid fa-clock mr-1"></i> Pickup Hours: Mon-Fri 8 AM - 4 PM</span>
                            <span><i className="fa-solid fa-phone mr-1"></i> Store Helpdesk: ext 402</span>
                        </div>
                    </div>

                    {/* Main Header */}
                    <header className="sticky top-0 z-30 bg-white border-b border-slate-200 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-20">
                                
                                {/* Logo & School Brand */}
                                <div 
                                    className="flex items-center gap-3 cursor-pointer"
                                    onClick={() => { setCurrentView('store'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                >
                                    <div className="w-12 h-12 bg-brand-700 text-white rounded-xl flex items-center justify-center text-lg font-bold shadow-md shadow-brand-700/20">
                                        LGH
                                    </div>
                                    <div>
                                        <h1 className="text-lg font-bold text-slate-900 leading-tight">Shri L. G. Haria School</h1>
                                        <p className="text-xs text-brand-600 font-semibold tracking-wider uppercase">Official Campus Store</p>
                                    </div>
                                </div>

                                {/* Search Bar (Desktop) */}
                                {currentView === 'store' && (
                                    <div className="hidden md:flex flex-1 max-w-md mx-8">
                                        <div className="relative w-full">
                                            <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                            <input 
                                                type="text" 
                                                placeholder="Search hoodies, notebooks, water bottles..."
                                                value={searchQuery}
                                                onChange={(e) => setSearchQuery(e.target.value)}
                                                className="w-full pl-10 pr-10 py-2.5 bg-slate-100 hover:bg-slate-50 focus:bg-white border border-transparent focus:border-brand-500 rounded-full text-sm transition-all focus:ring-2 focus:ring-brand-500/20 outline-none"
                                            />
                                            {searchQuery && (
                                                <button 
                                                    onClick={() => setSearchQuery('')}
                                                    className="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
                                                >
                                                    <i className="fa-solid fa-xmark"></i>
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {/* Header Right Controls */}
                                <div className="flex items-center gap-4">
                                    {currentView !== 'store' && (
                                        <button 
                                            onClick={() => setCurrentView('store')}
                                            className="text-sm font-semibold text-brand-600 hover:text-brand-800 flex items-center gap-2"
                                        >
                                            <i className="fa-solid fa-arrow-left"></i>
                                            <span>Back to Store</span>
                                        </button>
                                    )}

                                    {/* Cart Icon Button */}
                                    <button 
                                        onClick={() => setIsCartOpen(true)}
                                        className="relative p-2.5 text-slate-700 hover:text-brand-600 bg-slate-100 hover:bg-brand-50 rounded-full transition-all"
                                        aria-label="View Shopping Cart"
                                    >
                                        <i className="fa-solid fa-bag-shopping text-lg"></i>
                                        {cartItemsCount > 0 && (
                                            <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[11px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white animate-bounce">
                                                {cartItemsCount}
                                            </span>
                                        )}
                                    </button>
                                </div>
                            </div>

                            {/* Mobile Search Input */}
                            {currentView === 'store' && (
                                <div className="pb-3 md:hidden">
                                    <div className="relative w-full">
                                        <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                        <input 
                                            type="text" 
                                            placeholder="Search items..."
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            className="w-full pl-10 pr-10 py-2 bg-slate-100 border border-slate-200 rounded-full text-sm outline-none"
                                        />
                                    </div>
                                </div>
                            )}
                        </div>
                    </header>

                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white text-sm px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 animate-fade-in border border-slate-700">
                            <i className="fa-solid fa-circle-check text-green-400"></i>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {}
                    <main className="flex-grow">
                        {currentView === 'store' && (
                            <div>
                                {/* Hero Banner Section */}
                                <div className="bg-gradient-to-r from-brand-800 via-brand-700 to-indigo-900 text-white py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
                                    <div className="absolute inset-0 opacity-10 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:16px_16px]"></div>
                                    <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-8 relative z-10">
                                        <div className="max-w-xl text-center md:text-left">
                                            <span className="inline-block bg-gold-500/20 text-gold-400 border border-gold-500/30 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider mb-3">
                                                Shri L. G. Haria Official Merch
                                            </span>
                                            <h2 className="text-3xl sm:text-4xl font-extrabold tracking-tight text-white mb-4">
                                                Wear Your School Pride with Quality & Style
                                            </h2>
                                            <p className="text-slate-200 text-sm sm:text-base mb-6 leading-relaxed">
                                                Explore official uniforms, winter hoodies, house athletics apparel, ergonomic backpacks, and premium academic stationery for Shri L. G. Haria School.
                                            </p>
                                            <div className="flex flex-wrap gap-3 justify-center md:justify-start">
                                                <button 
                                                    onClick={() => setSelectedCategory('Apparel')}
                                                    className="bg-gold-500 hover:bg-gold-400 text-brand-900 font-bold px-5 py-2.5 rounded-xl shadow-lg transition-all text-sm"
                                                >
                                                    Shop Apparel <i className="fa-solid fa-arrow-right ml-1"></i>
                                                </button>
                                                <button 
                                                    onClick={() => setSelectedCategory('All')}
                                                    className="bg-white/10 hover:bg-white/20 text-white font-medium border border-white/20 px-5 py-2.5 rounded-xl transition-all text-sm backdrop-blur-sm"
                                                >
                                                    Browse All Items
                                                </button>
                                            </div>
                                        </div>
                                        
                                        {/* Banner Promo Card */}
                                        <div className="bg-white/10 border border-white/15 p-6 rounded-2xl backdrop-blur-md max-w-sm w-full text-center sm:text-left">
                                            <div className="flex items-center gap-3 mb-3">
                                                <div className="w-10 h-10 rounded-full bg-gold-400 text-brand-900 flex items-center justify-center font-bold text-lg">
                                                    <i className="fa-solid fa-tag"></i>
                                                </div>
                                                <div>
                                                    <h4 className="font-bold text-white text-base">Campus Student Discount</h4>
                                                    <p className="text-xs text-slate-300">Enter your Student ID at checkout</p>
                                                </div>
                                            </div>
                                            <p className="text-xs text-slate-200 bg-black/20 p-2.5 rounded-lg border border-white/5">
                                                Instant campus pick-up available at the Student Union Merchandise Desk!
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                {/* Filters and Categories Bar */}
                                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-200 pb-6">
                                        
                                        {/* Category Tabs */}
                                        <div className="flex items-center gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 scrollbar-none">
                                            {categories.map(cat => (
                                                <button
                                                    key={cat}
                                                    onClick={() => setSelectedCategory(cat)}
                                                    className={`px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all ${
                                                        selectedCategory === cat 
                                                            ? 'bg-brand-700 text-white shadow-md shadow-brand-700/20' 
                                                            : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'
                                                    }`}
                                                >
                                                    {cat}
                                                </button>
                                            ))}
                                        </div>

                                        {/* Sort dropdown and count */}
                                        <div className="flex items-center justify-between w-full md:w-auto gap-4">
                                            <span className="text-xs font-medium text-slate-500">
                                                Showing <strong className="text-slate-800">{filteredProducts.length}</strong> items
                                            </span>

                                            <div className="flex items-center gap-2">
                                                <label className="text-xs font-semibold text-slate-500 whitespace-nowrap">Sort by:</label>
                                                <select 
                                                    value={sortBy}
                                                    onChange={(e) => setSortBy(e.target.value)}
                                                    className="bg-white border border-slate-200 rounded-lg px-3 py-1.5 text-xs font-medium text-slate-700 outline-none focus:border-brand-500"
                                                >
                                                    <option value="featured">Featured</option>
                                                    <option value="price-low">Price: Low to High</option>
                                                    <option value="price-high">Price: High to Low</option>
                                                    <option value="rating">Highest Rated</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    {}
                                    {filteredProducts.length === 0 ? (
                                        <div className="text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300 mt-6">
                                            <i className="fa-solid fa-box-open text-4xl text-slate-300 mb-3"></i>
                                            <h3 className="text-lg font-bold text-slate-700">No products found</h3>
                                            <p className="text-sm text-slate-500 mt-1">Try adjusting your search query or filter settings.</p>
                                            <button 
                                                onClick={() => { setSelectedCategory('All'); setSearchQuery(''); }}
                                                className="mt-4 px-4 py-2 bg-brand-50 text-brand-700 rounded-lg text-xs font-bold hover:bg-brand-100"
                                            >
                                                Reset Filters
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-6">
                                            {filteredProducts.map(product => (
                                                <div 
                                                    key={product.id}
                                                    className="bg-white border border-slate-200/80 rounded-2xl overflow-hidden hover:shadow-xl transition-all duration-300 flex flex-col group"
                                                >
                                                    {/* Product Image Box */}
                                                    <div className="relative aspect-square overflow-hidden bg-slate-100 cursor-pointer" onClick={() => setModalProduct(product)}>
                                                        <img 
                                                            src={product.image} 
                                                            alt={product.name}
                                                            className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                                                            loading="lazy"
                                                        />
                                                        {product.badge && (
                                                            <span className="absolute top-3 left-3 bg-brand-700 text-white text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider shadow-sm">

                                            {completedOrder.customerInfo.deliveryType === 'campus' ? (
                                                <p className="text-slate-700 font-medium">
                                                    <i className="fa-solid fa-building-columns mr-1 text-slate-400"></i>
                                                    Campus Store Desk, Room 102, Student Union
                                                </p>
                                            ) : (
                                                <p className="text-slate-700 leading-relaxed">
                                                    {completedOrder.customerInfo.address}, {completedOrder.customerInfo.city} - {completedOrder.customerInfo.pincode}
                                                </p>
                                            )}
                                        </div>
                                    </div>

                                    {/* Itemized Receipt Table */}
                                    <div className="py-6">
                                        <h4 className="font-bold text-slate-800 uppercase tracking-wider text-[11px] mb-3 text-brand-700">Item Breakdown</h4>
                                        <div className="divide-y divide-slate-100">
                                            {completedOrder.items.map((item, idx) => (
                                                <div key={idx} className="py-2.5 flex justify-between items-center text-xs">
                                                    <div>
                                                        <p className="font-bold text-slate-800">{item.name}</p>
                                                        <p className="text-slate-400 text-[11px]">Size: {item.selectedSize} | Color: {item.selectedColor} | Qty: {item.quantity}</p>
                                                    </div>
                                                    <span className="font-bold text-slate-800">₹{item.price * item.quantity}</span>
                                                </div>
                                            ))}
                                        </div>

                                        <div className="border-t border-slate-200 mt-4 pt-4 space-y-1.5 text-xs text-right">
                                            <p className="text-slate-500">Subtotal: <span className="font-semibold text-slate-800">₹{completedOrder.subtotal}</span></p>
                                            <p className="text-slate-500">Delivery: <span className="font-semibold text-slate-800">₹{completedOrder.shippingFee}</span></p>
                                            <p className="text-base font-extrabold text-slate-900 pt-1">
                                                Total Amount Paid: <span className="text-brand-700">₹{completedOrder.grandTotal}</span>
                                            </p>
                                        </div>
                                    </div>

                                    {/* Actions */}
                                    <div className="pt-6 border-t border-slate-200 flex flex-col sm:flex-row gap-3 justify-center no-print">
                                        <button 
                                            onClick={() => window.print()}
                                            className="px-6 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl text-xs transition-all flex items-center justify-center gap-2"
                                        >
                                            <i className="fa-solid fa-print"></i> Print Receipt
                                        </button>
                                        <button 
                                            onClick={() => { setCurrentView('store'); setCompletedOrder(null); }}
                                            className="px-6 py-2.5 bg-brand-700 hover:bg-brand-800 text-white font-bold rounded-xl text-xs transition-all flex items-center justify-center gap-2"
                                        >
                                            <i className="fa-solid fa-store"></i> Return to Shop
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {}
                    {modalProduct && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
                            <div className="bg-white rounded-3xl max-w-2xl w-full overflow-hidden shadow-2xl relative animate-scale-up">
                                <button 
                                    onClick={() => setModalProduct(null)}
                                    className="absolute top-4 right-4 z-10 w-9 h-9 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-full flex items-center justify-center transition-all"
                                >
                                    <i className="fa-solid fa-xmark"></i>
                                </button>

                                <div className="grid grid-cols-1 sm:grid-cols-2">
                                    <div className="bg-slate-100 relative aspect-square sm:aspect-auto">
                                        <img src={modalProduct.image} alt={modalProduct.name} className="w-full h-full object-cover" />
                                    </div>

                                    <div className="p-6 flex flex-col justify-between">
                                        <div>
                                            <span className="text-xs font-bold text-brand-600 uppercase tracking-wider">{modalProduct.category}</span>
                                            <h3 className="text-xl font-bold text-slate-900 mt-1 mb-2">{modalProduct.name}</h3>

                                            <div className="flex items-center gap-2 mb-4">
                                                <div className="flex text-amber-400 text-xs">
                                                    <i className="fa-solid fa-star"></i>
                                                    <i className="fa-solid fa-star"></i>
                                                    <i className="fa-solid fa-star"></i>
                                                    <i className="fa-solid fa-star"></i>
                                                    <i className="fa-solid fa-star-half-stroke"></i>
                                                </div>
                                                <span className="text-xs font-bold text-slate-700">{modalProduct.rating}</span>
                                                <span className="text-xs text-slate-400">({modalProduct.reviewsCount} verified reviews)</span>
                                            </div>

                                            <p className="text-slate-600 text-xs leading-relaxed mb-6">
                                                {modalProduct.description}
                                            </p>

                                            {/* Size Selector */}
                                            {modalProduct.sizes && modalProduct.sizes.length > 0 && (
                                                <div className="mb-4">
                                                    <label className="block text-xs font-bold text-slate-700 mb-2">Select Size / Option:</label>
                                                    <div className="flex flex-wrap gap-2">
                                                        {modalProduct.sizes.map((sz, idx) => (
                                                            <span 
                                                                key={idx}
                                                                className="px-3 py-1.5 bg-slate-100 hover:bg-brand-50 hover:text-brand-700 border border-slate-200 rounded-lg text-xs font-semibold cursor-pointer transition-all"
                                                            >
                                                                {sz}
                                                            </span>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        <div className="pt-4 border-t border-slate-100 flex items-center justify-between">
                                            <div>
                                                <span className="text-2xl font-extrabold text-slate-900">₹{modalProduct.price}</span>
                                                {modalProduct.originalPrice && (
                                                    <span className="text-xs text-slate-400 line-through block">M.R.P: ₹{modalProduct.originalPrice}</span>
                                                )}
                                            </div>

                                            <button 
                                                onClick={() => {
                                                    addToCart(modalProduct);
                                                    setModalProduct(null);
                                                }}
                                                className="bg-brand-700 hover:bg-brand-800 text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-md transition-all flex items-center gap-2"
                                            >
                                                <i className="fa-solid fa-cart-plus"></i> Add to Cart
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {isCartOpen && (
                        <div className="fixed inset-0 z-50 overflow-hidden">
                            <div className="absolute inset-0 bg-slate-900/50 backdrop-blur-xs transition-opacity" onClick={() => setIsCartOpen(false)}></div>

                            <div className="fixed inset-y-0 right-0 max-w-full flex pl-10">
                                <div className="w-screen max-w-md bg-white shadow-2xl flex flex-col">
                                    
                                    {/* Drawer Header */}
                                    <div className="p-5 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                                        <div className="flex items-center gap-2">
                                            <i className="fa-solid fa-bag-shopping text-brand-700"></i>
                                            <h3 className="font-bold text-slate-900 text-base">Your Shopping Cart</h3>
                                            <span className="bg-brand-100 text-brand-800 text-xs font-bold px-2 py-0.5 rounded-full">
                                                {cartItemsCount}
                                            </span>
                                        </div>
                                        <button 
                                            onClick={() => setIsCartOpen(false)}
                                            className="text-slate-400 hover:text-slate-600 p-1"
                                        >
                                            <i className="fa-solid fa-xmark text-lg"></i>
                                        </button>
                                    </div>

                                    {/* Drawer Body - Items List */}
                                    <div className="flex-1 overflow-y-auto p-5 space-y-4">
                                        {cart.length === 0 ? (
                                            <div className="text-center py-16 text-slate-400">
                                                <i className="fa-solid fa-basket-shopping text-5xl mb-3 text-slate-300"></i>
                                                <p className="font-bold text-slate-700 text-sm">Your cart is empty</p>
                                                <p className="text-xs text-slate-400 mt-1">Browse our school merch and add your favorite items!</p>
                                            </div>
                                        ) : (
                                            cart.map(item => (
                                                <div 
                                                    key={item.cartItemId}
                                                    className="flex items-center gap-3 p-3 bg-slate-50 border border-slate-200/80 rounded-2xl relative group"
                                                >
                                                    <img src={item.image} alt={item.name} className="w-16 h-16 object-cover rounded-xl bg-white" />
                                                    
                                                    <div className="flex-1 min-w-0">
                                                        <h4 className="font-bold text-xs text-slate-800 truncate">{item.name}</h4>
                                                        <p className="text-[11px] text-slate-500 mb-1">
                                                            Size: <span className="font-semibold text-slate-700">{item.selectedSize}</span>
                                                        </p>

                                                        {/* Quantity selector */}
                                                        <div className="flex items-center gap-2">
                                                            <div className="flex items-center border border-slate-300 rounded-lg bg-white">
                                                                <button 
                                                                    onClick={() => updateCartQuantity(item.cartItemId, -1)}
                                                                    className="px-2 py-0.5 text-xs text-slate-600 hover:bg-slate-100 rounded-l-lg"
                                                                >
                                                                    <i className="fa-solid fa-minus text-[10px]"></i>
                                                                </button>
                                                                <span className="px-2 text-xs font-bold text-slate-800">{item.quantity}</span>
                                                                <button 
                                                                    onClick={() => updateCartQuantity(item.cartItemId, 1)}
                                                                    className="px-2 py-0.5 text-xs text-slate-600 hover:bg-slate-100 rounded-r-lg"
                                                                >
                                                                    <i className="fa-solid fa-plus text-[10px]"></i>
                                                                </button>
                                                            </div>
                                                            <span className="font-extrabold text-xs text-slate-900">₹{item.price * item.quantity}</span>
                                                        </div>
                                                    </div>

                                                    <button 
                                                        onClick={() => removeFromCart(item.cartItemId)}
                                                        className="text-slate-400 hover:text-red-500 p-2 text-sm transition-colors"
                                                        aria-label="Remove item"
                                                    >
                                                        <i className="fa-solid fa-trash-can"></i>
                                                    </button>
                                                </div>
                                            ))
                                        )}
                                    </div>

                                    {/* Drawer Footer */}
                                    {cart.length > 0 && (
                                        <div className="p-5 border-t border-slate-200 bg-white space-y-3">
                                            <div className="flex justify-between items-center text-sm">
                                                <span className="text-slate-500">Subtotal Amount</span>
                                                <span className="font-extrabold text-slate-900 text-base">₹{cartTotal}</span>
                                            </div>
                                            <p className="text-[11px] text-slate-400">Taxes calculated at checkout. Free campus pickup available.</p>

                                            <button 
                                                onClick={() => {
                                                    setIsCartOpen(false);
                                                    setCurrentView('checkout');
                                                }}
                                                className="w-full bg-brand-700 hover:bg-brand-800 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-wider shadow-md transition-all flex items-center justify-center gap-2"
                                            >
                                                <span>Proceed to Checkout</span>
                                                <i className="fa-solid fa-arrow-right"></i>
                                            </button>
                                        </div>
                                    )}

                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="bg-slate-900 text-slate-400 text-xs py-8 border-t border-slate-800 mt-auto">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-2">
                                <div className="w-6 h-6 bg-brand-700 text-white rounded-md flex items-center justify-center font-bold text-[10px]">LGH</div>
                                <span className="font-bold text-slate-200">Shri L. G. Haria School Store</span>
                                <span>© 2026 Official Campus Store. All rights reserved.</span>
                            </div>
                            <div className="flex gap-4 text-slate-400">
                                <span className="hover:text-white cursor-pointer">Store Policy</span>
                                <span className="hover:text-white cursor-pointer">Campus Pickup Info</span>
                                <span className="hover:text-white cursor-pointer">Support</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
